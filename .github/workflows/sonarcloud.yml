name: CI - Build, Test, Coverage, SonarCloud

on:
  push:
    branches: [ develop, main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    env:
      SPRING_PROFILES_ACTIVE: test
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Gradle - version info
        run: ./gradlew -version

      # ======== Build + Tests + Coverage (RECOMENDADO) ========
      # Nota: antes usabas "build -x test" (omitía pruebas). Aquí sí ejecutamos tests.
      - name: Build, Test & Coverage (JaCoCo)
        run: |
          ./gradlew --no-daemon clean test jacocoTestReport jacocoTestCoverageVerification

      # ======== Análisis SonarCloud vía Gradle (RECOMENDADO) ========
      # IMPORTANTE: en SonarCloud desactiva "Automatic Analysis" si usas este paso.
      - name: SonarCloud analysis (Gradle 'sonar')
        run: |
          ./gradlew --no-daemon sonar \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.gradle.skipCompile=true
        # Si definiste sonar.host.url/organization/projectKey en gradle.properties no hace falta pasarlos aquí.

      # ======== Artefactos de reportes (siempre) ========
      - name: Upload unit-test report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          # Usa glob doble por si migras a multi-módulo en el futuro
          path: '**/build/reports/tests/test'
          if-no-files-found: warn
          retention-days: 7

      - name: Upload JaCoCo report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/build/reports/jacoco/test/html'
          if-no-files-found: warn
          retention-days: 7

      # ======== OPCIONAL: Análisis SonarCloud con la Action oficial (ALTERNATIVA) ========
      # Usa ESTO solo si NO ejecutas el paso 'sonar' de Gradle arriba.
      # Asegúrate también de tener desactivado "Automatic Analysis".
      # - name: SonarCloud Scan (official action)  # <-- ALTERNATIVA (comentado)
      #   if: false                              # habilítalo si quieres probar esta vía
      #   uses: SonarSource/sonarcloud-github-action@v2
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     args: >
      #       -Dsonar.host.url=https://sonarcloud.io
      #       -Dsonar.organization=<tu_org>
      #       -Dsonar.projectKey=<tu_projectKey>
      #       -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
