spring.application.name=CRM

# --- Datasource (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/crm_api?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=crmuser
spring.datasource.password=crmuser123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# --- Flyway (migraciones en src/main/resources/db/migration) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=crm_api
spring.flyway.default-schema=crm_api

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui-custom.html
springdoc.swagger-ui.operationsSorter=method

# --- Server ---
server.port=8089