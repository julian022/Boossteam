spring.application.name=CRM
spring.datasource.url=jdbc:mysql:127.0.0.1:3306/bossteam
spring.datasource.username=bossteam
spring.datasource.password=bossteam
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
springdoc.swagger-ui.path=/swagger-ui-custom.htmlspringdoc.swagger-ui.operationsSorter=method

# Puerto del servidor
server.port=8089
